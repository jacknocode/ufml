name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  editor-app:
    name: Editor App (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ufml-editor-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ufml-editor-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  overview-app:
    name: Overview App (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ufml-overview-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ufml-overview-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
